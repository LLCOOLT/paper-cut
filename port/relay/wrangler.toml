# Paper Cut's online relay (docs/ONLINE_RELAY.md): `npx wrangler deploy` from
# this folder, on a free Cloudflare account. The free plan's Durable Objects
# are the SQLite-backed kind (new_sqlite_classes).
name = "papercut-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# the room list (0.4.0): one Durable Object for every room's listing and count
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

# paper notes and leaderboards (0.4.0): a Durable Object per area's notes and
# per leaderboard (docs/PAPER_NOTES.md, docs/LEADERBOARDS.md)
[[durable_objects.bindings]]
name = "NOTES"
class_name = "Notes"

[[durable_objects.bindings]]
name = "BOARDS"
class_name = "Board"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Notes", "Board"]
