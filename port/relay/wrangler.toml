# Paper Cut's online relay (docs/ONLINE_RELAY.md): `npx wrangler deploy` from
# this folder, on a free Cloudflare account. The free plan's Durable Objects
# are the SQLite-backed kind (new_sqlite_classes).
name = "papercut-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
