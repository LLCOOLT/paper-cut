# Paper Cut's online relay (docs/ONLINE_RELAY.md): `npx wrangler deploy` from
# this folder, on a free Cloudflare account. The free plan's Durable Objects
# are the SQLite-backed kind (new_sqlite_classes).
name = "papercut-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# the room list (0.4.0): one Durable Object for every room's listing and count; since 0.5.1 also the
# relay's day (GET /budget) and its health counts (GET /health): no new binding or migration
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

# paper notes and leaderboards (0.4.0): a Durable Object per area's notes and
# per leaderboard (docs/PAPER_NOTES.md, docs/LEADERBOARDS.md)
[[durable_objects.bindings]]
name = "NOTES"
class_name = "Notes"

[[durable_objects.bindings]]
name = "BOARDS"
class_name = "Board"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Notes", "Board"]

# bingo rooms (0.4.0): one Durable Object per lockout room
[[durable_objects.bindings]]
name = "BINGO"
class_name = "Bingo"

[[migrations]]
tag = "bingo-v1"
new_sqlite_classes = ["Bingo"]

# the daily seed's results boards (0.4.0): one Durable Object per day
[[durable_objects.bindings]]
name = "DAILY"
class_name = "Daily"

[[migrations]]
tag = "daily-v1"
new_sqlite_classes = ["Daily"]

# the raid boss's weekly boards (0.4.0): one Durable Object per week
[[durable_objects.bindings]]
name = "RAID"
class_name = "Raid"

[[migrations]]
tag = "raid-v1"
new_sqlite_classes = ["Raid"]

# 0.5.1's per-address limits (src/index.js, overLimit): without these bindings the Worker counts in
# its own memory (best effort). If the account's plan offers the rate limiting binding, uncomment
# these: the counts are then Cloudflare's, per location, and much harder to get around.
# [[ratelimits]]
# name = "ROOM_LIMIT"
# namespace_id = "1001"
# simple = { limit = 30, period = 60 }
#
# [[ratelimits]]
# name = "HTTP_LIMIT"
# namespace_id = "1002"
# simple = { limit = 120, period = 60 }
