org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
# ABIs to build (comma-separated). arm64-v8a: phones, tablets, arm64 emulators.
# x86_64 (Intel/AMD emulators) has no prebuilt Dawn: Aurora builds Dawn from
# source for it, which takes long (docs/PC_PORT.md, "Android").
ttyd.abis=arm64-v8a
